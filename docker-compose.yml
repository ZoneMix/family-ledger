services:
  actual-server:
    image: actualbudget/actual-server:26.9.0
    container_name: actual-server
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${ACTUAL_PORT:-5006}:5006"
    volumes:
      - ./actual-data:/data
    networks:
      - family-ledger
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: .
    image: family-ledger:local
    container_name: family-ledger
    restart: unless-stopped
    depends_on:
      - actual-server
    # Default publishes on every interface (LAN-first). Set BIND_ADDR=127.0.0.1
    # in .env when Caddy fronts the stack, or a Tailscale IP (100.x.y.z) to
    # expose it on the tailnet only.
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${DASHBOARD_PORT:-3100}:3000"
    volumes:
      - ./cache:/cache
      - ./state:/state
    # Settings come from .env via env_file, NOT ${VAR} interpolation:
    # interpolated values are resolved host-side where a stray exported
    # ACTUAL_PASSWORD in the user's shell would silently override the
    # file. env_file reads the file directly, so .env always wins.
    # (required: false keeps `docker compose config` working pre-setup.)
    env_file:
      - path: .env
        required: false
    environment:
      ACTUAL_SERVER_URL: http://actual-server:5006
    # Every secret (ACTUAL_PASSWORD, DASHBOARD_PASSWORD, ACTUAL_FILE_PASSWORD)
    # also accepts a <NAME>_FILE path instead of the value itself, so it can
    # be sourced from a Docker secret rather than .env — uncomment both
    # blocks below and the top-level `secrets:` block to use it:
    # secrets: [actual_password]
    # environment:
    #   ACTUAL_PASSWORD_FILE: /run/secrets/actual_password
    networks:
      - family-ledger
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  family-ledger:
    driver: bridge

