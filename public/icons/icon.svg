<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="The Family Ledger">
  <!-- Cream paper ground, almanac-masthead motif: double rules, ledger
       entry lines, and the colophon asterism. Font-free so it renders
       identically everywhere. -->
  <rect width="512" height="512" rx="100" fill="#F5F1E8"/>

  <!-- Top masthead double rule -->
  <rect x="96" y="116" width="320" height="9" fill="#26231D"/>
  <rect x="96" y="133" width="320" height="3" fill="#26231D"/>

  <!-- Ledger entry lines -->
  <rect x="128" y="196" width="256" height="7" rx="3.5" fill="#26231D"/>
  <rect x="128" y="238" width="256" height="7" rx="3.5" fill="#26231D"/>
  <rect x="128" y="280" width="168" height="7" rx="3.5" fill="#26231D"/>

  <!-- Asterism -->
  <path d="M256 322 L272 344 L256 366 L240 344 Z" fill="#26231D"/>

  <!-- Bottom masthead double rule (mirrored) -->
  <rect x="96" y="376" width="320" height="3" fill="#26231D"/>
  <rect x="96" y="390" width="320" height="9" fill="#26231D"/>
</svg>
